name: rec_rir_dereverb_16k_fp32
task: SE
model:
  uid: rec-rir-dereverb-16k-fp32
  architecture: Rec-RIR
  version: epoch35-vem-mint
  task: SE
  languages: [auto]
runtime:
  device: cuda
  dtype: float32
  chip: RTX3090
  batch_size: 1
io:
  input_type: audio_path
  output_type: audio_path
  schema:
    input:
      audio_path:
        type: string
        required: true
      output_path:
        type: string
        required: false
      mode:
        type: string
        default: vem
        required: false
    output:
      audio_path:
        type: string
        required: true
      rir_path:
        type: string
        required: true
      prior_path:
        type: string
        required: false
      sample_rate:
        type: integer
        required: true
      mode:
        type: string
        required: true
protocols:
  strict_core:
    enabled: true
    param_map:
      precision:
        model_param: dtype
        mapping:
          float32: torch.float32
      max_batch_size:
        model_param: batch_size
        mapping:
          "1": 1
server:
  command: [".venv/bin/python", "server.py"]
  env:
    MODEL_PATH: checkpoint.tar
    MODEL_DEVICE: cuda
  timeout: 1800
